name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build extension
        run: pnpm --filter extension build

      - name: Audit YouTube API boundary
        run: node scripts/audit-youtube-api-boundary.mjs

      - name: Audit extension artifact
        run: node scripts/audit-extension-package.mjs

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-algorithm-extension
          path: apps/extension/dist
          if-no-files-found: error
