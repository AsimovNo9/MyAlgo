<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460" width="340" height="460">
  <defs>
    <style>
      .bg { fill: #0F0F0F; }
      .surface { fill: #181818; rx: 8px; }
      .text-primary { fill: #FFFFFF; font-family: -apple-system, Roboto, sans-serif; }
      .text-secondary { fill: #AAAAAA; font-family: -apple-system, Roboto, sans-serif; font-size: 12px; }
      .text-title { font-size: 16px; font-weight: 500; }
      .badge-bg { fill: rgba(16, 185, 129, 0.15); rx: 4px; }
      .badge-text { fill: #10B981; font-size: 10px; font-weight: bold; }
      .divider { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; }
      .btn-primary { fill: #6366F1; rx: 4px; }
      .btn-secondary { fill: #212121; rx: 4px; }
      .segmented-bg { fill: #0F0F0F; rx: 6px; }
      .segmented-active { fill: #212121; rx: 4px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="340" height="460" />

  <!-- Header -->
  <text x="16" y="32" class="text-primary text-title">Personal Algorithm</text>
  <rect x="270" y="18" width="54" height="20" class="badge-bg" />
  <text x="278" y="32" class="badge-text" font-family="sans-serif">ACTIVE</text>
  <text x="16" y="52" class="text-secondary">Status: Connected • Last sync: 2m ago</text>

  <!-- Mode Selector -->
  <rect class="surface" x="16" y="76" width="308" height="80" />
  <text x="32" y="100" class="text-secondary" font-weight="bold">CURRENT MODE</text>
  <rect class="segmented-bg" x="32" y="112" width="276" height="32" />
  <rect class="segmented-active" x="36" y="116" width="90" height="24" />
  <text x="64" y="133" class="text-primary" font-size="13px" font-weight="500">Work</text>
  <text x="142" y="133" class="text-secondary" font-size="13px">Learning</text>
  <text x="238" y="133" class="text-secondary" font-size="13px">Relax</text>

  <!-- Feed Sources -->
  <rect class="surface" x="16" y="172" width="308" height="110" />
  <text x="32" y="196" class="text-secondary" font-weight="bold">FEED CONTROLS</text>

  <!-- Checkboxes -->
  <rect x="32" y="210" width="16" height="16" rx="2" fill="#6366F1" />
  <path d="M36 218 L40 222 L44 214" stroke="#FFF" stroke-width="2" fill="none" />
  <text x="56" y="223" class="text-primary" font-size="13px">Subscriptions</text>

  <rect x="170" y="210" width="16" height="16" rx="2" fill="#6366F1" />
  <path d="M174 218 L178 222 L182 214" stroke="#FFF" stroke-width="2" fill="none" />
  <text x="194" y="223" class="text-primary" font-size="13px">Discovery</text>

  <rect x="32" y="240" width="16" height="16" rx="2" fill="#6366F1" />
  <path d="M36 248 L40 252 L44 244" stroke="#FFF" stroke-width="2" fill="none" />
  <text x="56" y="253" class="text-primary" font-size="13px">Hide Shorts</text>

  <rect x="170" y="240" width="16" height="16" rx="2" fill="#212121" stroke="rgba(255,255,255,0.2)" />
  <text x="194" y="253" class="text-primary" font-size="13px">Hide Live</text>

  <!-- Feed Summary -->
  <rect class="surface" x="16" y="298" width="308" height="84" />
  <text x="32" y="322" class="text-secondary" font-weight="bold">CACHED CANDIDATES</text>
  <text x="32" y="342" class="text-primary" font-size="13px">12 Matched • 8 Discovery • 2 Explore</text>
  <text x="32" y="362" class="text-secondary">Ready for next page generation</text>

  <!-- Actions -->
  <rect class="btn-secondary" x="16" y="398" width="148" height="36" />
  <text x="50" y="420" class="text-primary" font-size="13px" font-weight="500">Refresh feed</text>

  <rect class="btn-primary" x="176" y="398" width="148" height="36" />
  <text x="212" y="420" class="text-primary" font-size="13px" font-weight="500">Tune algorithm</text>
</svg>
