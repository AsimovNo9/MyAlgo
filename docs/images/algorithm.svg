<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <defs>
    <style>
      .bg { fill: #0F0F0F; }
      .surface { fill: #181818; rx: 8px; stroke: #2A2A2A; stroke-width: 1; }
      .text-primary { fill: #FFFFFF; font-family: -apple-system, Roboto, sans-serif; }
      .text-secondary { fill: #A1A1AA; font-family: -apple-system, Roboto, sans-serif; font-size: 13px; }
      .text-title { font-size: 18px; font-weight: 600; }
      .text-label { font-size: 12px; font-weight: 500; letter-spacing: 0.5px; fill: #A1A1AA; }
      .input-bg { fill: #000000; rx: 6px; stroke: #333; stroke-width: 1; }
      .btn-primary { fill: #6366F1; rx: 6px; }
      .btn-secondary { fill: #27272A; rx: 6px; }
      .slider-track { fill: #3F3F46; rx: 3px; }
      .slider-fill { fill: #6366F1; rx: 3px; }
      .slider-thumb { fill: #FFFFFF; rx: 8px; }

      /* Rule Tags */
      .tag-never { fill: rgba(244, 63, 94, 0.15); stroke: rgba(244, 63, 94, 0.3); rx: 4px; }
      .tag-never-text { fill: #FB7185; font-size: 12px; font-weight: 500; }
      .tag-always { fill: rgba(16, 185, 129, 0.15); stroke: rgba(16, 185, 129, 0.3); rx: 4px; }
      .tag-always-text { fill: #34D399; font-size: 12px; font-weight: 500; }
    </style>
  </defs>

  <rect class="bg" width="900" height="680" />

  <!-- Sidebar Navigation -->
  <rect x="0" y="0" width="220" height="680" fill="#121212" />
  <text x="24" y="40" class="text-primary text-title">MindfulFeed</text>
  <text x="24" y="90" class="text-label">ACTIVE ALGORITHMS</text>

  <rect x="16" y="104" width="188" height="36" fill="#27272A" rx="6" />
  <text x="32" y="127" class="text-primary" font-size="14px">Work</text>
  <circle cx="184" cy="122" r="4" fill="#10B981" />

  <text x="32" y="167" class="text-secondary" font-size="14px">Learning</text>
  <text x="32" y="207" class="text-secondary" font-size="14px">Relax</text>

  <!-- Main Content Area -->
  <g transform="translate(250, 40)">
    <text x="0" y="0" class="text-primary text-title" font-size="24px">Edit "Work" Algorithm</text>

    <!-- Goal Section -->
    <text x="0" y="40" class="text-label">OPERATIONAL GOAL</text>
    <rect x="0" y="52" width="600" height="60" class="input-bg" />
    <text x="16" y="86" class="text-primary" font-size="14px">Learn AI agents and shipping decisions.</text>

    <!-- Topic Weights Section -->
    <text x="0" y="150" class="text-label">TOPIC WEIGHTS (0-100)</text>
    <rect x="0" y="162" width="600" height="190" class="surface" />

    <!-- Slider 1 -->
    <text x="24" y="196" class="text-primary" font-size="14px">AI &amp; ML</text>
    <rect x="150" y="190" width="360" height="6" class="slider-track" />
    <rect x="150" y="190" width="306" height="6" class="slider-fill" /> <!-- 85% -->
    <circle cx="456" cy="193" r="8" class="slider-thumb" />
    <text x="530" y="196" class="text-primary" font-weight="600">85</text>

    <!-- Slider 2 -->
    <text x="24" y="246" class="text-primary" font-size="14px">Productivity</text>
    <rect x="150" y="240" width="360" height="6" class="slider-track" />
    <rect x="150" y="240" width="216" height="6" class="slider-fill" /> <!-- 60% -->
    <circle cx="366" cy="243" r="8" class="slider-thumb" />
    <text x="530" y="246" class="text-primary" font-weight="600">60</text>

    <!-- Slider 3 -->
    <text x="24" y="296" class="text-primary" font-size="14px">Engineering</text>
    <rect x="150" y="290" width="360" height="6" class="slider-track" />
    <rect x="150" y="290" width="270" height="6" class="slider-fill" /> <!-- 75% -->
    <circle cx="420" cy="293" r="8" class="slider-thumb" />
    <text x="530" y="296" class="text-primary" font-weight="600">75</text>

    <!-- Explicit Normalization Action -->
    <rect x="440" y="312" width="136" height="28" class="btn-secondary" />
    <text x="456" y="331" class="text-primary" font-size="12px">Distribute Evenly</text>

    <!-- Hard Rules Section -->
    <text x="0" y="390" class="text-label">HARD RULES &amp; EXCLUSIONS</text>
    <rect x="0" y="402" width="600" height="120" class="surface" />

    <rect x="24" y="426" width="190" height="28" class="tag-always" />
    <text x="36" y="445" class="tag-always-text">always_show: AI tutorials</text>

    <rect x="226" y="426" width="220" height="28" class="tag-never" />
    <text x="238" y="445" class="tag-never-text">never_show: celebrity gossip</text>

    <!-- Custom Rule Input -->
    <rect x="24" y="474" width="120" height="32" class="input-bg" />
    <text x="36" y="495" class="text-secondary" font-size="13px">Rule type ▼</text>

    <rect x="152" y="474" width="336" height="32" class="input-bg" />
    <text x="164" y="495" class="text-secondary" font-size="13px">Add concept or creator...</text>

    <rect x="496" y="474" width="80" height="32" class="btn-primary" />
    <text x="522" y="495" class="text-primary" font-size="13px">Add</text>

    <!-- Save Actions -->
    <rect x="0" y="550" width="140" height="40" class="btn-primary" />
    <text x="24" y="575" class="text-primary" font-weight="500">Save Algorithm</text>
  </g>
</svg>
